openapi: 3.0.3
info:
  title: Device Service API
  version: 1.0.0
  description: REST API для управления устройствами
servers:
  - url: /v1
paths:
  /devices:
    post:
      operationId: createDevice
      summary: Создать устройство
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRequest'
      responses:
        '202':
          description: Запрос принят
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateResponse'
  /devices/{deviceId}:
    get:
      operationId: getDevice
      summary: Получить устройство по ID
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '404':
          description: Устройство не найдено
    put:
      operationId: updateDevice
      summary: Обновить устройство
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRequest'
      responses:
        '202':
          description: Запрос принят
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
    delete:
      operationId: deleteDevice
      summary: Удалить устройство
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Запрос принят
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /devices/{deviceId}/version:
    put:
      operationId: setDeviceTargetVersion
      summary: Зафиксировать целевую версию ПО устройства
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TargetVersionRequest'
      responses:
        '202':
          description: Целевая версия принята
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Устройство не найдено
        '409':
          description: Конфликт (идемпотентность или несовместимая операция)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'

components:
  schemas:
    DeviceRequest:
      type: object
      required:
        - deviceType
      properties:
        deviceType:
          type: string
          description: Тип устройства
        meta:
          type: string
          nullable: true
          description: Метаданные (JSON-строка)
    Device:
      type: object
      description: Модель устройства
      properties:
        deviceId:
          type: string
        deviceType:
          type: string
        createdAt:
          type: integer
          format: int64
        meta:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time
        targetSoftwareVersion:
          type: string
          nullable: true
          description: Целевая версия ПО (если задана)
    TargetVersionRequest:
      type: object
      required:
        - targetVersion
      properties:
        targetVersion:
          type: string
          description: Целевая версия прошивки/ПО
        idempotencyKey:
          type: string
          nullable: true
          description: Ключ идемпотентности операции
    ConflictError:
      type: object
      properties:
        message:
          type: string
        code:
          type: string
    CreateResponse:
      type: object
      properties:
        message:
          type: string
        deviceId:
          type: string
    MessageResponse:
      type: object
      properties:
        message:
          type: string
        deviceId:
          type: string
