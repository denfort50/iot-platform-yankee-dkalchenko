server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        # Слушать на всех интерфейсах, чтобы Alloy (другой контейнер) мог слать трейсы по gRPC.
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  trace_idle_period: 10s

compactor:
  compaction:
    compacted_block_retention: 48h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces