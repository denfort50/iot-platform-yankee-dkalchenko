# Запуск в Docker: хосты — имена сервисов в docker-compose, приложение слушает 8080 (main), 9090 (actuator).
spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL}

clickhouse:
  datasource:
    # compress=0 нужен для совместимости Liquibase с драйвером ClickHouse
    url: ${CLICKHOUSE_URL}
    username: ${CLICKHOUSE_USER}
    password: ${CLICKHOUSE_PASSWORD}

management:
  server:
    port: 9090
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  otlp:
    tracing:
      # Трейсы в Alloy (OTLP HTTP), далее в Tempo
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT}