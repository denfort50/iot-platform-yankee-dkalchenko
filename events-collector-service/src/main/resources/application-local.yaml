# Локальный запуск (инфра — Docker или локально). Порты совпадают с первым инстансом в docker-compose (8093, 9073).
server:
  port: 8093

spring:
  data:
    redis:
      host: localhost
      port: 6379
      password: admin
  kafka:
    bootstrap-servers: localhost:19092,localhost:19093,localhost:19094
    properties:
      schema.registry.url: http://localhost:8081

clickhouse:
  datasource:
    # compress=0 нужен для совместимости Liquibase с драйвером ClickHouse
    url: jdbc:clickhouse://localhost:8123/clickhouse?compress=0
    username: admin
    password: admin

management:
  server:
    port: 9073
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  otlp:
    tracing:
      # Alloy в Docker слушает на 4318; при пробросе порта — localhost:4318
      endpoint: http://localhost:4318/v1/traces