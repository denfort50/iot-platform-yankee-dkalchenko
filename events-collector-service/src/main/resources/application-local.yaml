server:
  port: 8091

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:admin}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092,localhost:19093,localhost:19094}
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}

clickhouse:
  datasource:
    # compress=0 нужен для совместимости Liquibase с драйвером ClickHouse
    url: ${CLICKHOUSE_URL:jdbc:clickhouse://localhost:8123/clickhouse?compress=0}
    username: ${CLICKHOUSE_USER:admin}
    password: ${CLICKHOUSE_PASSWORD:admin}

management:
  server:
    port: 9071