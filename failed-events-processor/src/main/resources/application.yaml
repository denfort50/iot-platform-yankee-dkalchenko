failed-events-processor:
  listener:
    dlt-topic: dlt.v1
  minio:
    endpoint: ${MINIO_ENDPOINT}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket-failed-events: failed-events
    bucket-failed-devices: failed-devices

spring:
  application:
    name: failed-events-processor
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: failed-events-processor-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      heartbeat-interval: 3000
      max-poll-records: 10
      max-poll-interval: 60000
      properties:
        session.timeout.ms: 9000
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL}
      specific.avro.reader: true
      auto.register.schemas: true
      use.latest.version: true

logging:
  level:
    ru.dkalchenko.failedevents: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      probes:
        enabled: true
    prometheus:
      access: unrestricted
  prometheus:
    metrics:
      export:
        enabled: true
  otlp:
    logging:
      export:
        enabled: false
    metrics:
      export:
        enabled: false
